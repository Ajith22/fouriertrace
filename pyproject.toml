[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fouriertrace"
version = "0.1.0"
description = "Turn images with simple curves into complex Fourier series and epicycle animations"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ajith Kumar", email = "ajithkumar953@gmail.com" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "opencv-python-headless>=4.6",
    "matplotlib>=3.5",
    "pillow>=9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
fouriertrace = "fouriertrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
